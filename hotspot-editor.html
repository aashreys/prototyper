<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pointer Hotspot Editor</title>
  <style>
    :root {
      --blue: #0d99ff;
      --text: #1e1e1e;
      --secondary: #767676;
      --border: #dedede;
      --panel: #f4f4f4;
      --control: #f1f1f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: white;
    }

    main {
      display: grid;
      grid-template-columns: minmax(340px, 1fr) 300px;
      gap: 24px;
      max-width: 960px;
      min-height: 100vh;
      padding: 24px;
      margin: 0 auto;
    }

    h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .stage-wrap {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .source-status {
      color: var(--secondary);
      min-height: 18px;
    }

    select,
    input,
    button,
    textarea {
      font: inherit;
    }

    select,
    input,
    textarea {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      color: var(--text);
    }

    select {
      height: 36px;
      min-width: 160px;
      padding: 0 32px 0 10px;
    }

    button {
      height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: white;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 560px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(45deg, #eee 25%, transparent 25%),
        linear-gradient(-45deg, #eee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eee 75%),
        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      user-select: none;
    }

    .image-box {
      position: relative;
      display: inline-block;
      line-height: 0;
      cursor: crosshair;
    }

    .cursor-image {
      display: block;
      max-width: min(520px, calc(100vw - 420px));
      max-height: 520px;
      width: auto;
      height: auto;
    }

    .guide {
      position: absolute;
      pointer-events: none;
      background: rgba(13, 153, 255, 0.45);
    }

    .guide.x {
      left: 0;
      right: 0;
      height: 1px;
    }

    .guide.y {
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .hotspot {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid var(--blue);
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      transform: translate(-50%, -50%);
      cursor: grab;
    }

    .hotspot:active {
      cursor: grabbing;
    }

    .panel {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .label {
      color: var(--secondary);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: grid;
      gap: 4px;
    }

    input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
    }

    textarea {
      width: 100%;
      min-height: 92px;
      padding: 10px;
      resize: vertical;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .meta {
      display: grid;
      gap: 4px;
      color: var(--secondary);
    }

    .value {
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }

      h1 {
        grid-column: auto;
      }

      .cursor-image {
        max-width: calc(100vw - 72px);
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pointer hotspot editor</h1>

    <section class="stage-wrap">
      <div class="toolbar">
        <select id="preset"></select>
        <button id="copy">Copy coordinates</button>
        <button class="secondary" id="reset">Reset to current code value</button>
      </div>
      <div class="source-status" id="sourceStatus"></div>

      <div class="stage">
        <div class="image-box" id="imageBox">
          <img class="cursor-image" id="cursorImage" alt="" />
          <div class="guide x" id="guideX"></div>
          <div class="guide y" id="guideY"></div>
          <div class="hotspot" id="hotspot" title="Drag hotspot"></div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="meta">
          <div>Image: <span class="value" id="imageName"></span></div>
          <div>Natural size: <span class="value" id="naturalSize"></span></div>
          <div>Pixel hotspot: <span class="value" id="pixelValue"></span></div>
        </div>
      </div>

      <div class="card">
        <div class="grid">
          <label class="field">
            <span class="label">Normalized x</span>
            <input id="normX" inputmode="decimal" />
          </label>
          <label class="field">
            <span class="label">Normalized y</span>
            <input id="normY" inputmode="decimal" />
          </label>
          <label class="field">
            <span class="label">Pixel x</span>
            <input id="pixelX" inputmode="numeric" />
          </label>
          <label class="field">
            <span class="label">Pixel y</span>
            <input id="pixelY" inputmode="numeric" />
          </label>
        </div>
      </div>

      <div class="card">
        <div class="label">Paste this into the code</div>
        <textarea id="snippet" readonly></textarea>
      </div>
    </aside>
  </main>

  <script>
    const presetSelect = document.getElementById("preset");
    const cursorImage = document.getElementById("cursorImage");
    const imageBox = document.getElementById("imageBox");
    const hotspot = document.getElementById("hotspot");
    const guideX = document.getElementById("guideX");
    const guideY = document.getElementById("guideY");
    const imageName = document.getElementById("imageName");
    const naturalSize = document.getElementById("naturalSize");
    const pixelValue = document.getElementById("pixelValue");
    const normX = document.getElementById("normX");
    const normY = document.getElementById("normY");
    const pixelX = document.getElementById("pixelX");
    const pixelY = document.getElementById("pixelY");
    const snippet = document.getElementById("snippet");
    const copy = document.getElementById("copy");
    const reset = document.getElementById("reset");
    const sourceStatus = document.getElementById("sourceStatus");

    let presets = [];
    let activePreset;
    let hotspotValue = { x: 0, y: 0 };
    let dragging = false;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function rounded(value, digits = 3) {
      return Number(value.toFixed(digits));
    }

    function setHotspot(value) {
      hotspotValue = {
        x: clamp(value.x, 0, 1),
        y: clamp(value.y, 0, 1)
      };
      render();
    }

    async function loadPresetsFromSource() {
      sourceStatus.textContent = "Loading assets from src/pointer_assets.ts";
      const response = await fetch("src/pointer_assets.ts", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load src/pointer_assets.ts (${response.status})`);
      }

      presets = parsePointerPresets(await response.text());
      if (presets.length === 0) {
        throw new Error("No pointer presets found in src/pointer_assets.ts");
      }

      presetSelect.innerHTML = "";
      for (const preset of presets) {
        const option = document.createElement("option");
        option.value = preset.id;
        option.textContent = preset.label;
        presetSelect.appendChild(option);
      }
      sourceStatus.textContent = "Using assets from src/pointer_assets.ts";
      loadPreset(presets[0].id);
    }

    function parsePointerPresets(source) {
      const presetsMatch = source.match(/POINTER_PRESETS[\s\S]*?=\s*\[([\s\S]*?)\n\]/);
      if (!presetsMatch) return [];

      const items = [];
      const itemPattern = /\{\s*id:\s*'([^']+)',\s*label:\s*'([^']+)',\s*mimeType:\s*'([^']+)',\s*hotspot:\s*\{\s*x:\s*([0-9.]+),\s*y:\s*([0-9.]+)\s*\},\s*base64:\s*'([^']+)'/g;
      let match;
      while ((match = itemPattern.exec(presetsMatch[1])) !== null) {
        items.push({
          id: match[1],
          label: match[2],
          mimeType: match[3],
          hotspot: {
            x: Number(match[4]),
            y: Number(match[5])
          },
          src: `data:${match[3]};base64,${match[6]}`
        });
      }
      return items;
    }

    function imageRect() {
      return cursorImage.getBoundingClientRect();
    }

    function setHotspotFromEvent(event) {
      const rect = imageRect();
      setHotspot({
        x: (event.clientX - rect.left) / rect.width,
        y: (event.clientY - rect.top) / rect.height
      });
    }

    function loadPreset(id) {
      activePreset = presets.find((preset) => preset.id === id) || presets[0];
      hotspotValue = { ...activePreset.hotspot };
      cursorImage.src = activePreset.src;
      imageName.textContent = activePreset.label;
      presetSelect.value = activePreset.id;
      render();
    }

    function render() {
      const displayWidth = cursorImage.clientWidth || 1;
      const displayHeight = cursorImage.clientHeight || 1;
      const naturalWidth = cursorImage.naturalWidth || 0;
      const naturalHeight = cursorImage.naturalHeight || 0;
      const left = hotspotValue.x * displayWidth;
      const top = hotspotValue.y * displayHeight;
      const px = Math.round(hotspotValue.x * naturalWidth);
      const py = Math.round(hotspotValue.y * naturalHeight);

      hotspot.style.left = `${left}px`;
      hotspot.style.top = `${top}px`;
      guideX.style.top = `${top}px`;
      guideY.style.left = `${left}px`;

      naturalSize.textContent = naturalWidth > 0 ? `${naturalWidth} x ${naturalHeight}` : "Loading";
      pixelValue.textContent = naturalWidth > 0 ? `${px}, ${py}` : "Loading";
      normX.value = String(rounded(hotspotValue.x));
      normY.value = String(rounded(hotspotValue.y));
      pixelX.value = naturalWidth > 0 ? String(px) : "";
      pixelY.value = naturalHeight > 0 ? String(py) : "";
      snippet.value = `hotspot: { x: ${rounded(hotspotValue.x)}, y: ${rounded(hotspotValue.y)} }`;
    }

    presetSelect.addEventListener("change", () => loadPreset(presetSelect.value));
    cursorImage.addEventListener("load", render);
    window.addEventListener("resize", render);

    imageBox.addEventListener("pointerdown", (event) => {
      dragging = true;
      imageBox.setPointerCapture(event.pointerId);
      setHotspotFromEvent(event);
    });

    imageBox.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      setHotspotFromEvent(event);
    });

    imageBox.addEventListener("pointerup", () => {
      dragging = false;
    });

    imageBox.addEventListener("pointercancel", () => {
      dragging = false;
    });

    normX.addEventListener("change", () => {
      setHotspot({ x: Number(normX.value), y: hotspotValue.y });
    });

    normY.addEventListener("change", () => {
      setHotspot({ x: hotspotValue.x, y: Number(normY.value) });
    });

    pixelX.addEventListener("change", () => {
      setHotspot({
        x: Number(pixelX.value) / (cursorImage.naturalWidth || 1),
        y: hotspotValue.y
      });
    });

    pixelY.addEventListener("change", () => {
      setHotspot({
        x: hotspotValue.x,
        y: Number(pixelY.value) / (cursorImage.naturalHeight || 1)
      });
    });

    copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(snippet.value);
      copy.textContent = "Copied";
      setTimeout(() => {
        copy.textContent = "Copy coordinates";
      }, 900);
    });

    reset.addEventListener("click", () => setHotspot(activePreset.hotspot));

    loadPresetsFromSource().catch((error) => {
      sourceStatus.textContent = error.message;
      presetSelect.disabled = true;
      copy.disabled = true;
      reset.disabled = true;
    });
  </script>
</body>
</html>
